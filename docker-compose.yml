networks:
  smartstock_net:
    driver: bridge

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: smartstock_db
    environment:
      POSTGRES_USER: smartstock
      POSTGRES_PASSWORD: smartstock
      POSTGRES_DB: smartstock
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"  # host 5432 is taken by a local Postgres; app uses the internal network (db:5432)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartstock -d smartstock"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - smartstock_net

  redis:
    image: redis:7-alpine
    container_name: smartstock_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - smartstock_net

  backend:
    build:
      context: ./smartstock-backend
      dockerfile: Dockerfile
      network: host
    container_name: smartstock_backend
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - smartstock-backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./smartstock-backend:/app
      - /app/staticfiles
      - /app/.venv
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - smartstock_net

  celery:
    build:
      context: ./smartstock-backend
      dockerfile: Dockerfile
      network: host
    container_name: smartstock_celery
    command: celery -A config worker --loglevel=info
    env_file:
      - smartstock-backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --timeout 5 || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    networks:
      - smartstock_net

  celery-beat:
    build:
      context: ./smartstock-backend
      dockerfile: Dockerfile
      network: host
    container_name: smartstock_celery_beat
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - smartstock-backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /proc/1/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - smartstock_net

  frontend:
    build:
      context: ./smartstock-frontend
      dockerfile: Dockerfile
      target: build
      network: host
    container_name: smartstock_frontend
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"
    volumes:
      - ./smartstock-frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000/api
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5173/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - smartstock_net

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: smartstock_prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    ports:
      - "127.0.0.1:9090:9090"  # Security: Bind to localhost only. Requires reverse proxy with auth for production access.
    networks:
      - smartstock_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: smartstock_alertmanager
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "127.0.0.1:9093:9093"  # Security: Bind to localhost only. Should not be exposed to untrusted networks.
    networks:
      - smartstock_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.1.0
    container_name: smartstock_grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: password
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"  # Security: Bind to localhost. Admin password required. Use reverse proxy for production access.
    networks:
      - smartstock_net
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  prometheus_data:
  grafana_data:
  postgres_data:
  redis_data: