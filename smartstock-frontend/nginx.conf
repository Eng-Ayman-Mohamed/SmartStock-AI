server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10M;

    # Security headers - prevent XSS, clickjacking, MIME sniffing
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-no-referrer" always;

    # Content Security Policy: Strict policy to prevent XSS and injection attacks
    # - default-src 'self': All content from same origin only
    # - script-src 'self': No inline scripts, no third-party scripts
    # - style-src 'self' 'unsafe-inline': Inline styles needed for Tailwind/React; Google Fonts
    # - font-src 'self': Only from same origin
    # - img-src 'self' data:: Images from same origin + data URIs (for avatars, etc)
    # - connect-src 'self': AJAX/fetch to same origin only
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; media-src 'none'; object-src 'none'; frame-ancestors 'none';" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /api {
        return 302 /api/;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
