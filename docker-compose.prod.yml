# =============================================================================
# SmartStock AI — Docker Compose (Railway-optimized)
# =============================================================================
# RAILWAY DEPLOYMENT NOTES:
#   - Railway does not use docker-compose directly. Each service below maps to
#     a separate Railway service on your project canvas.
#   - Add a Postgres plugin and a Redis plugin to your Railway project, then
#     reference their URLs in your environment variables.
#   - Drag-and-drop this file onto the Railway canvas to auto-import services,
#     then configure variables and domains per service.
#   - The monitoring stack (Prometheus, Grafana, Alertmanager) is commented out
#     below. For dashboards, use Grafana Cloud's free tier instead:
#     https://grafana.com/products/cloud/
#
# LOCAL TESTING:
#   cp .env.example .env  # fill in all values including VITE_API_URL
#   docker compose -f docker-compose.prod.yml up --build
# =============================================================================

networks:
  smartstock_net:
    driver: bridge

services:

  # ---------------------------------------------------------------------------
  # Backend — Django + Gunicorn
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./smartstock-backend
      dockerfile: Dockerfile
    container_name: smartstock_backend
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - smartstock_net
    # Railway: set START COMMAND to → gunicorn config.wsgi:application --bind 0.0.0.0:$PORT

  # ---------------------------------------------------------------------------
  # Celery Worker
  # ---------------------------------------------------------------------------
  celery:
    build:
      context: ./smartstock-backend
      dockerfile: Dockerfile
    container_name: smartstock_celery
    command: celery -A config worker --loglevel=info
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --timeout 5 || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    networks:
      - smartstock_net
    # Railway: set START COMMAND to → celery -A config worker --loglevel=info

  # ---------------------------------------------------------------------------
  # Celery Beat — Scheduled Tasks
  # ---------------------------------------------------------------------------
  celery-beat:
    build:
      context: ./smartstock-backend
      dockerfile: Dockerfile
    container_name: smartstock_celery_beat
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    healthcheck:
      test: ["CMD-SHELL", "test -f /proc/1/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - smartstock_net
    # Railway: set START COMMAND to → celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler

  # ---------------------------------------------------------------------------
  # Frontend — React (Nginx, production build)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./smartstock-frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    container_name: smartstock_frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - smartstock_net
    # Railway: exposes port 80. Railway auto-assigns an HTTPS domain.
    # VITE_API_URL must be set as a Railway build variable (not runtime),
    # since Vite bakes it into the JS bundle at build time.
    # Set it in your root .env file or Railway's Variables tab.

  # ---------------------------------------------------------------------------
